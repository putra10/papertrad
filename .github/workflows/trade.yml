name: paper-trade

# Fully unattended: this is the only thing that runs the bot. Nothing has to
# be started by hand.
#
# GitHub's scheduler is unreliable for short intervals: a */15 cron drops
# slots and runs late. So it is asked to fire only ONCE per session, and
# the script holds the 15-minute cadence itself with real sleeps.
#
# The horizon is swing / mid-term, but the cadence stays at 15 minutes: the
# prompt is what tells the model to carry positions for days, and checking
# often costs little while giving a much denser equity curve.
#
# Market holidays need no cron rule. The crons cover Mon-Fri, and on a
# holiday the script asks Alpaca's clock and calendar, finds the market
# closed, prints why, and exits after two API calls.
#
# Two triggers because cron cannot follow US daylight saving:
#   13:35 UTC = 09:35 ET during EDT (summer)
#   14:35 UTC = 09:35 ET during EST (winter), and a backup in summer
# Whichever fires while the market is open runs the session. The other
# finds it closed and exits after one API call. `concurrency` keeps them
# from ever trading the same account at the same time.

on:
  schedule:
    # GitHub drops schedule slots silently and gives no error when it does.
    # Both slots were dropped on 2026-08-27 and the bot simply did not trade
    # that day. So ask several times: the first fire that actually lands runs
    # the session, later ones queue behind `concurrency`, start after it ends,
    # find the market closed and exit. A dropped slot now costs 30 minutes
    # instead of the whole day.
    - cron: "35 13 * * 1-5"   # 09:35 ET during EDT
    - cron: "5 14 * * 1-5"
    - cron: "35 14 * * 1-5"   # 09:35 ET during EST, backup during EDT
    - cron: "5 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-trade
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest        # 1x minute multiplier
    timeout-minutes: 350          # runner hard-caps a job at 360

    steps:
      - uses: actions/checkout@v4   # keeps credentials so the script can push
        with:
          # Default depth=1 leaves nothing to merge against when a queued
          # run starts from a base origin has already moved past.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Configure git for the bot's own commits
        run: |
          git config user.name  "paper-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Trade the session
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AUTO_COMMIT: "1"        # push state every cycle, not just at the end
          # Without this Python block-buffers stdout: a cancelled run flushes
          # nothing, so the log looks like the bot never did anything.
          PYTHONUNBUFFERED: "1"
        run: python paper_trader.py --session 15

      - name: Final sync
        if: always()              # still commit if the session errored out
        run: |
          # Every cycle already pushed its own state, so origin is the truth.
          # Reset to it before rebuilding: a run that was queued behind another
          # starts from a stale checkout, and committing on that stale base is
          # what made `git pull --rebase` conflict and fail run #3.
          git fetch origin main
          git reset --hard origin/main
          python build_dashboard.py
          git add -A baseline_state.json trade_log.jsonl docs/
          if git diff --staged --quiet; then
            echo "nothing left to commit"
          else
            git commit -m "session end $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
